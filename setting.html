<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>설정</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<header class="site-header">

    <h1>설정</h1>

</header>


<main class="settings-container">


    <!-- =========================
         메인으로 돌아가기
    ========================== -->

    <div class="settings-top">

        <a
            href="index.html"
            class="back-button"
        >
            메인으로 돌아가기
        </a>

    </div>


    <!-- =========================
         챕터 선택
    ========================== -->

    <section class="settings-section">

        <h2>챕터 선택</h2>


        <div class="chapter-select-row">

            <select
                id="chapterSelect"
            >

                <option value="">
                    챕터를 선택하세요
                </option>

            </select>


            <button
                id="deleteChapterButton"
                class="danger-button"
                type="button"
            >
                챕터 삭제
            </button>

        </div>

    </section>


    <!-- =========================
         챕터 추가
    ========================== -->

    <section class="settings-section">

        <h2>챕터 추가</h2>


        <div class="input-group">

            <label for="newChapterName">
                챕터 이름
            </label>

            <input
                id="newChapterName"
                type="text"
                placeholder="예: N1 동사"
            >

        </div>


        <button
            id="addChapterButton"
            class="primary-button"
            type="button"
        >
            챕터 추가
        </button>

    </section>


    <!-- =========================
         선택된 챕터
    ========================== -->

    <section
        id="chapterEditor"
        class="settings-section hidden"
    >

        <h2>챕터 수정</h2>


        <!-- 챕터 이름 -->

        <div class="input-group">

            <label for="chapterName">
                챕터 이름
            </label>

            <input
                id="chapterName"
                type="text"
            >

        </div>


        <button
            id="saveChapterButton"
            class="secondary-button"
            type="button"
        >
            챕터 이름 저장
        </button>


        <!-- =========================
             단어 목록
        ========================== -->

        <div class="word-editor-header">

            <h2>단어 목록</h2>

            <span
                id="wordCount"
                class="word-count"
            >
                0단어
            </span>

        </div>


        <div
            id="wordList"
            class="word-editor-list"
        >
        </div>


        <!-- =========================
             단어 추가
        ========================== -->

        <div class="add-word-box">

            <h3>단어 추가</h3>


            <div class="input-group">

                <label for="newWord">
                    일본어
                </label>

                <input
                    id="newWord"
                    type="text"
                    placeholder="예: 促す"
                >

            </div>


            <div class="input-group">

                <label for="newReading">
                    발음
                </label>

                <input
                    id="newReading"
                    type="text"
                    placeholder="예: うながす"
                >

            </div>


            <div class="input-group">

                <label for="newMeaning">
                    뜻
                </label>

                <input
                    id="newMeaning"
                    type="text"
                    placeholder="예: 촉구하다"
                >

            </div>


            <button
                id="addWordButton"
                class="primary-button"
                type="button"
            >
                단어 추가
            </button>

        </div>

    </section>


    <!-- =========================
         JSON
    ========================== -->

    <section class="settings-section">

        <div class="json-header">

            <h2>생성된 JSON</h2>


            <button
                id="copyJsonButton"
                class="secondary-button"
                type="button"
            >
                JSON 복사
            </button>

        </div>


        <textarea
            id="jsonOutput"
            class="json-output"
            readonly
        ></textarea>


        <button
            id="downloadJsonButton"
            class="secondary-button full-button"
            type="button"
        >
            words.json 다운로드
        </button>

    </section>


</main>


<script src="js/common.js"></script>
<script src="js/setting.js"></script>

</body>

</html>
